name: Security Scan - PII & Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets and PII
        run: |
          echo "🔍 Scanning for secrets, API keys, and PII patterns..."
          FOUND=0

          # Define patterns to search for
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'                           # AWS Access Key
            '[0-9a-zA-Z/+]{40}'                           # AWS Secret Key (40-char base64)
            'sk-[a-zA-Z0-9]{20,}'                         # OpenAI / Stripe secret key
            'ghp_[a-zA-Z0-9]{36}'                         # GitHub personal access token
            'gho_[a-zA-Z0-9]{36}'                         # GitHub OAuth token
            'github_pat_[a-zA-Z0-9_]{82}'                 # GitHub fine-grained PAT
            'xox[bpors]-[a-zA-Z0-9-]+'                    # Slack token
            'sk_live_[a-zA-Z0-9]+'                        # Stripe live key
            'rk_live_[a-zA-Z0-9]+'                        # Stripe restricted key
            'SG\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+'         # SendGrid API key
            '[0-9]+-[a-zA-Z0-9_]{32}\.apps\.googleusercontent\.com'  # Google OAuth
            'AIza[0-9A-Za-z_-]{35}'                       # Google API key
            'ya29\.[0-9A-Za-z_-]+'                        # Google OAuth token
            'password\s*[=:]\s*["'][^\s"'\'']{8,}'     # Hardcoded passwords
            'PRIVATE KEY-----'                             # Private keys
            'Bearer [a-zA-Z0-9_\-\.]{20,}'                # Bearer tokens
          )

          # Directories/files to exclude
          EXCLUDES="--exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github --exclude=*.lock --exclude=*.min.js --exclude=package-lock.json --exclude=yarn.lock"

          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rPn $EXCLUDES "$pattern" . 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️  Pattern match found: $pattern"
              echo "$MATCHES" | head -5
              echo "---"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "❌ SECURITY SCAN FAILED: Potential secrets or sensitive data detected!"
            echo "Please review the matches above and remove any real secrets."
            echo "If these are false positives, consider adding them to .gitignore or using environment variables."
            exit 1
          else
            echo "✅ Security scan passed — no secrets or PII patterns detected."
          fi
