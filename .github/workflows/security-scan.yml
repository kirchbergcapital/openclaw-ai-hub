name: Security Scan - PII & Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets and PII
        run: |
          echo "Scanning for secrets, API keys, and PII patterns..."
          FOUND=0

          PATTERNS=(
            'AKIA[0-9A-Z]{16}'
            'sk-[a-zA-Z0-9]{20,}'
            'ghp_[a-zA-Z0-9]{36}'
            'gho_[a-zA-Z0-9]{36}'
            'github_pat_[a-zA-Z0-9_]{82}'
            'xox[bpors]-[a-zA-Z0-9-]+'
            'sk_live_[a-zA-Z0-9]+'
            'rk_live_[a-zA-Z0-9]+'
            'SG\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+'
            '[0-9]+-[a-zA-Z0-9_]{32}\.apps\.googleusercontent\.com'
            'AIza[0-9A-Za-z_-]{35}'
            'ya29\.[0-9A-Za-z_-]+'
            'PRIVATE KEY-----'
            'Bearer [a-zA-Z0-9_\-\.]{20,}'
          )

          EXCLUDES="--exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github --exclude=*.lock --exclude=*.min.js --exclude=package-lock.json --exclude=yarn.lock"

          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rPn $EXCLUDES "$pattern" . 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "WARNING: Pattern match found: $pattern"
              echo "$MATCHES" | head -5
              echo "---"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "SECURITY SCAN FAILED: Potential secrets or sensitive data detected!"
            echo "Please review the matches above and remove any real secrets."
            exit 1
          else
            echo "Security scan passed - no secrets or PII patterns detected."
          fi
